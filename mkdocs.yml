site_name: 3D Gallery Search
repo_url: https://github.com/Whiplashhhh/SAE_3D_Gallery_Search
docs_dir: docs

theme:
  name: material
  language: fr

nav:
  - Accueil: index.md
  - Documentation technique:
      - Architecture: technique/architecture.md
      - Décisions: DECISION.md
      - Installation & déploiement: technique/deploiement.md
  - Documentation utilisateur:
      - Guide d'utilisation: utilisateur/guide.md
      - FAQ: utilisateur/faq.md
  - Référence du code:
      - reference/index.md
      - Configuration: reference/config.md
      - Contrats: reference/contrats.md
      - Sémantique (Lot B): reference/semantique.md
      - IA: reference/ia.md
      - Ollama: reference/ollama.md
      - Recherche (Lot C): reference/recherche.md
  - Suivi des sprints:
      - Sprint 0: monitoring/sprint-00.md
      - Sprint 1: monitoring/sprint-01.md
      - Sprint 2: monitoring/sprint-02.md
      - Sprint 3: monitoring/sprint-03.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:      # pour les diagrammes Mermaid (architecture, UML)
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend/src]
          options:
            show_source: true
            show_root_heading: false
            heading_level: 3
            members_order: source
            show_if_no_docstring: true