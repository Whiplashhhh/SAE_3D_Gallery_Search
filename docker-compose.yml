services:
  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${MODELE_EMBEDDING:-embeddinggemma}"]
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MODELE_VLM: ${MODELE_VLM:-qwen3-vl:instruct}
      MODELE_LLM: ${MODELE_LLM:-gemma4:12b}
      MODELE_EMBEDDING: ${MODELE_EMBEDDING:-embeddinggemma}
      DIMENSION_EMBEDDING: ${DIMENSION_EMBEDDING:-768}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-180}
    volumes:
      - backend-data:/app/data
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  backend-data:
  ollama-models:
