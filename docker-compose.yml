services:
  backend:
    build:
      context: ./backend
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MODELE_EMBEDDING: ${MODELE_EMBEDDING:-embeddinggemma}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-10}
    volumes:
      - backend-data:/app/data
      - ./donnees/fiches:/donnees/fiches
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  backend-data:
